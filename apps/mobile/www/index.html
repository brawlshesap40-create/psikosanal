<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <title>Psikosanal</title>
    <style>
      :root {
        color-scheme: light dark;
        --brand: #0b7c86;
        --bg: #f7fbfb;
        --fg: #123;
        --muted: #5b7377;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1516;
          --fg: #eef5f5;
          --muted: #9fb3b5;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px calc(28px + env(safe-area-inset-left)) 28px
          calc(28px + env(safe-area-inset-right));
        background: var(--bg);
        color: var(--fg);
        font: 400 16px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 340px;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        display: block;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 14px;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 13px 22px;
        background: var(--brand);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
      }
      code {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        color: var(--fg);
        background: color-mix(in srgb, var(--brand) 14%, transparent);
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="28" height="28" rx="8.5" fill="#0b7c86" />
        <g fill="#f7fbfb">
          <rect x="7.5" y="8" width="17" height="12.5" rx="5" />
          <path d="M11 19 L10 24.6 L16 19.5 Z" />
        </g>
        <g fill="#067079">
          <circle cx="13" cy="13" r="1.15" />
          <circle cx="19" cy="13" r="1.15" />
        </g>
        <path
          d="M12.8 15.4 Q16 18.4 19.2 15.4"
          fill="none"
          stroke="#067079"
          stroke-width="2.2"
          stroke-linecap="round"
        />
      </svg>
      <h1>Psikosanal</h1>
      <p id="msg">
        Uygulamanın sunucu adresi tanımlı değil. Derleme sırasında
        <code>CAP_SERVER_URL</code> verin ya da bağlantınızı kontrol edip yeniden
        deneyin.
      </p>
      <button id="retry" onclick="location.reload()">Yeniden dene</button>
    </div>
  </body>
</html>
